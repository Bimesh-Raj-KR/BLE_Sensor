<!DOCTYPE html>
<html>
<head>
    <title>Server Count</title>
    <link rel="stylesheet" href="styleCount.css">
</head>
<body>
    <h1>Server Count</h1>
    <div class="data-box" id = "get-count">Count Loading.....</div>
        <div class="input-sections">
            <div class="input-box">
                <div class="header red">POST</div>
                <div class="container">
                    <input type="number" id = "post-count" placeholder="Enter count">
                </div>
            </div>
            <div class="input-box">
                <div class="header green">PUT</div>
                <div class="container">
                    <input type="number" id = "put-count" placeholder="Enter count">
                </div>
            </div>
        </div>

    <script src="scriptGetCount.js"></script>
    <script src="scriptGiveCount.js"></script>
</body>
</html>
