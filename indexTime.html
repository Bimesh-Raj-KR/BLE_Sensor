<!DOCTYPE html>
<html>
<head>
    <title>Server Time</title>
    <link rel="stylesheet" href="styleTime.css">
</head>
<body>
    <h1>Server Time (updates every second)</h1>
    <div style="display: flex; gap: 20px; align-items: center; justify-content: center; height: 200px;">
        <div style="border: 2px solid #333; padding: 30px; text-align: center;">
            <strong>DATE</strong>
            <div id="date-display" style="font-size: 30px;">--/--/----</div>
        </div>
        <div style="border: 2px solid #333; padding: 30px; text-align: center;">
            <strong>TIME</strong>
            <div id="time-display" style="font-size: 30px;">--:--:--</div>
        </div>
    </div>

    <script src="scriptTime.js"></script>
</body>
</html>
